# Stack local de Antójate. Un solo comando lo levanta todo:
#   ./scripts/bootstrap.sh
#
# Todos los servicios comparten la misma imagen (ERPNext + app antojate) y los
# mismos volúmenes de sites/logs, tal como lo hace el frappe_docker oficial.
x-antojate: &antojate
  image: ${ANTOJATE_IMAGE:-antojate/erpnext:v16.17.0}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      ERPNEXT_VERSION: ${ERPNEXT_VERSION:-v16.17.0}
  networks: [antojate]
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    # Código vivo: lo que edites en el host entra al contenedor sin rebuild.
    - ../apps/antojate:/home/frappe/frappe-bench/apps/antojate
  environment:
    DB_HOST: db
    DB_PORT: "3306"
    FRAPPE_REDIS_CACHE: redis://redis-cache:6379
    FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

services:
  db:
    image: mariadb:11.8
    networks: [antojate]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    networks: [antojate]
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    networks: [antojate]
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  # Escribe common_site_config.json (hosts de db y redis). Corre y termina.
  configurator:
    <<: *antojate
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        echo "configurator: listo";
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *antojate
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    <<: *antojate
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *antojate
    command: ["bench", "schedule"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  # Procesa los jobs en segundo plano: correos de pedido, conciliación de pagos.
  queue-short:
    <<: *antojate
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *antojate
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *antojate
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # Fijar el nombre del sitio hace que nginx sirva SIEMPRE este sitio sin
      # importar el Host de la petición. Es lo que permite que la URL aleatoria
      # del túnel de Cloudflare funcione sin tocar configuración.
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-antojate.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

  # Túnel público gratuito para que el cliente vea la tienda desde cualquier
  # parte. No requiere cuenta, dominio ni tarjeta: entrega una URL
  # https://<aleatorio>.trycloudflare.com mientras el contenedor esté vivo.
  # Se levanta aparte:  docker compose --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    networks: [antojate]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:8080
    depends_on:
      - frontend

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:

networks:
  antojate:
    name: antojate
